<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoVision — Client Demos</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: dark; font-family: Inter, Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; background: #03070b; color: #f4f8ff; }
      body::before { content: ""; position: fixed; inset: -25%; pointer-events: none; background: radial-gradient(circle at 20% 25%, rgba(22, 136, 255, .28), transparent 28%), radial-gradient(circle at 80% 75%, rgba(0, 197, 255, .16), transparent 30%); filter: blur(20px); }
      main { position: relative; width: min(980px, calc(100% - 48px)); padding: 56px 0; }
      p { margin: 0; color: #9badbf; letter-spacing: .08em; text-transform: uppercase; font-size: .72rem; }
      h1 { max-width: 650px; margin: 20px 0 44px; font-size: clamp(2.6rem, 7vw, 5.7rem); line-height: .92; letter-spacing: -.075em; }
      h1 span { color: #42b6ff; }
      .demos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      a { position: relative; min-height: 230px; padding: 26px; display: flex; flex-direction: column; justify-content: space-between; color: inherit; text-decoration: none; border: 1px solid rgba(104, 191, 255, .28); background: rgba(10, 22, 35, .78); transition: transform .35s ease, border-color .35s ease, background .35s ease; }
      a:hover, a:focus-visible { transform: translateY(-7px); border-color: #4bc0ff; background: rgba(16, 42, 64, .92); outline: none; }
      .number { color: #45bcff; font-family: ui-monospace, monospace; font-size: .78rem; }
      strong { display: block; font-size: clamp(1.6rem, 3.5vw, 2.5rem); letter-spacing: -.05em; }
      .arrow { color: #5bc7ff; font-size: 1.3rem; }
      @media (max-width: 620px) { body { overflow: auto; } .demos { grid-template-columns: 1fr; } h1 { margin-bottom: 28px; } a { min-height: 180px; } }
    </style>
  </head>
  <body>
    <main>
      <p>EchoVision / Client presentation</p>
      <h1>Choose a <span>direction.</span></h1>
      <section class="demos" aria-label="Website demo versions">
        <a href="./demo-1/" aria-label="Open Demo 1">
          <span class="number">01 / Editorial Direction</span>
          <strong>Demo 1</strong>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a href="./demo-2/" aria-label="Open Demo 2">
          <span class="number">02 / Creative Tech Direction</span>
          <strong>Demo 2</strong>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </section>
    </main>
  </body>
</html>
